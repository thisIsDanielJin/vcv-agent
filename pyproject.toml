[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "vcv-agent"
version = "0.1.0"
description = "LLM-in-the-loop sound design agent for VCV Rack Pro"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openai>=1.30",
    "anthropic>=0.25",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyzstd>=0.16",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
vcv-agent = "vcv_agent.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.setuptools.packages.find]
include = ["vcv_agent*"]
